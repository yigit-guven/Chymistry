name: Sync Docs to Wiki

on:
  push:
    branches:
      - 26.2-neoforge
    paths:
      - 'docs/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Wiki Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          # GITHUB_TOKEN has permission to push to the wiki by default
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync and Push
        run: |
          # Clear existing wiki contents (ignoring the .git folder)
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          
          # Copy everything from the docs/ folder into the wiki
          cp -r main-repo/docs/* wiki-repo/
          
          # Navigate to wiki repository and push changes
          cd wiki-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add .
          
          # Only commit and push if there are actual changes
          if git diff-index --quiet HEAD; then
            echo "No changes to sync."
          else
            git commit -m "Auto-sync docs to wiki [skip ci]"
            git push
          fi
